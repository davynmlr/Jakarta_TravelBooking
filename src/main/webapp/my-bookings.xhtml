<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:c="jakarta.tags.core">
<h:head>
    <title>Travel Booking — My Bookings</title>
</h:head>
<h:body>

    <f:event type="preRenderView" listener="#{sessionBean.requireLogin}"/>

    <h1>Travel Booking</h1>

    <p>
        Welcome, <h:outputText value="#{sessionBean.currentPassenger.firstname}"/> |
        <h:form styleClass="inline">
            <h:commandButton value="Logout" action="#{sessionBean.logout}"/>
        </h:form>
    </p>

    <h:link value="Flights" outcome="flights"/> |
    <h:link value="Destinations" outcome="destinations"/>

    <h2>My Bookings</h2>
    <p><h:outputText value="Flights booked by #{sessionBean.currentPassenger.fullName}"/></p>

    <h:panelGroup rendered="#{empty flightBean.currentPassengerFlights}">
        <p>You have no bookings yet.</p>
        <h:link value="Browse flights" outcome="flights"/>
    </h:panelGroup>

    <h:form id="cancelForm">
        <h:panelGroup rendered="#{not empty flightBean.currentPassengerFlights}">
            <table style="border:1px solid #000;border-collapse:collapse;">
                <thead>
                    <tr>
                        <th>Flight</th>
                        <th>Class</th>
                        <th>Destination</th>
                        <th>Departure</th>
                        <th>Price (CHF)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <c:forEach items="#{flightBean.currentPassengerFlights}" var="flight">
                        <tr>
                            <td><h:outputText value="#{flight.flightNumber} - #{flight.airline}"/></td>
                            <td><h:outputText value="#{flight.cabinClass}"/></td>
                            <td><h:outputText value="#{flight.destination.city} (#{flight.destination.airportCode})"/></td>
                            <td><h:outputText value="#{flight.departureTime}"><f:convertDateTime pattern="dd.MM.yyyy HH:mm"/></h:outputText></td>
                            <td><h:outputText value="#{flight.price}"/></td>
                            <td>
                                <h:commandButton value="Cancel booking"
                                                 action="#{flightBean.cancelFlight(flight.id)}"/>
                            </td>
                        </tr>
                    </c:forEach>
                </tbody>
            </table>
        </h:panelGroup>
    </h:form>

</h:body>
</html>
